name: Generate SEO pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**/*.json'
      - 'tools/generate-seo.mjs'
      - '.github/workflows/generate-seo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate SEO pages
        run: node tools/generate-seo.mjs

      - name: Commit generated SEO files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add books pages authors topics seo-index.html seo-sitemaps sitemap.xml

          if git diff --cached --quiet; then
            echo "No SEO changes to commit."
          else
            git commit -m "[skip ci] Generate SEO pages"
            git push
          fi
